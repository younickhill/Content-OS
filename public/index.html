<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14131c;
    --ink-soft: #1e1c29;
    --paper: #f6f3ee;
    --coral: #ff5c72;
    --amber: #ffc145;
    --muted: #9691a8;
    --danger: #ff7a7a;
    --success: #6fd68f;
    --line: rgba(246,243,238,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Manrope', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  h1, .display { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px 24px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0 8px;
  }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; }
  #header-spark { font-size: 16px; color: var(--coral); opacity: 0; transition: opacity 0.3s ease; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--ink-soft); color: var(--paper); font-family: inherit; font-size: 15px;
    margin-bottom: 8px;
  }
  input[type=text]:focus { outline: 1px solid var(--coral); }
  .error { display: none; font-size: 13px; color: var(--danger); margin: 0 0 8px; }
  button {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px;
    border: none; border-radius: 10px; padding: 13px 16px; cursor: pointer;
  }
  .btn-primary { background: var(--coral); color: var(--ink); width: 100%; margin-bottom: 14px; }
  .btn-secondary { background: var(--ink-soft); color: var(--paper); border: 1px solid var(--line); width: 100%; display: none; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .loading-row { display: none; align-items: center; gap: 8px; padding: 6px 2px; margin-bottom: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); opacity: 0.3; }
  .loading-text { font-size: 13px; color: var(--muted); }
  .card {
    background: var(--ink-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    position: relative; opacity: 0; transform: scale(0.92) translateY(6px);
    transition: opacity 0.35s cubic-bezier(0.34,1.56,0.64,1), transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .card.in { opacity: 1; transform: scale(1) translateY(0); }
  .card p { margin: 0; font-size: 14px; padding-right: 24px; }
  .card .card-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card .tag {
    display: inline-block; margin-top: 6px; font-size: 12px; color: var(--coral);
    background: rgba(255,92,114,0.14); padding: 2px 9px; border-radius: 100px;
  }
  .copy-icon {
    position: absolute; top: 12px; right: 12px; width: 16px; height: 16px; cursor: pointer;
    color: var(--muted); font-size: 13px; user-select: none;
  }
  .error-banner {
    background: rgba(255,122,122,0.12); border: 1px solid rgba(255,122,122,0.3);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--danger); margin-bottom: 10px;
    display: none;
  }
  .tabs { display: flex; gap: 2px; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; padding: 6px 2px; cursor: pointer; color: var(--muted);
  }
  .tab-btn svg { width: 18px; height: 18px; stroke: currentColor; }
  .tab-btn.active { color: var(--coral); }
  .tab-btn span { font-size: 11px; font-family: 'Manrope', sans-serif; font-weight: 500; }
  .panel { display: none; padding: 4px 0 8px; }
  .panel.active { display: block; }
  @keyframes iconPulse { 0% { transform: scale(0.5); } 65% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes iconSnip { 0% { transform: rotate(-30deg) scale(0.6); } 55% { transform: rotate(10deg) scale(1.15); } 100% { transform: rotate(0deg) scale(1); } }
  @keyframes iconDraw { 0% { transform: translateX(-6px) scale(0.7); } 100% { transform: translateX(0) scale(1); } }
  @keyframes iconPop { 0% { transform: scale(0.4) translateY(4px); } 65% { transform: scale(1.3) translateY(-2px); } 100% { transform: scale(1) translateY(0); } }
  @keyframes iconTick { 0% { transform: rotate(12deg) scale(0.6); } 55% { transform: rotate(-8deg) scale(1.2); } 100% { transform: rotate(0deg) scale(1); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="wordmark">Content OS</span>
    <span id="header-spark">✦</span>
  </header>

  <div id="panel-hooks" class="panel active">
    <label>Niche</label>
    <input class="mod-input" data-mod="hooks" type="text" placeholder="e.g. AI tools for freelancers" />
    <p class="error" data-mod="hooks">Enter a niche first</p>
    <button class="btn-primary gen-btn" data-mod="hooks">Generate hooks</button>
    <div class="loading-row" data-mod="hooks">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="loading-text">cooking up something viral</span>
    </div>
    <div class="error-banner" data-mod="hooks"></div>
    <div class="list" data-mod="hooks"></div>
    <button class="btn-secondary regen-btn" data-mod="hooks">↻ Regenerate</button>
  </div>

  <div id="panel-script" class="panel">
    <label>Hook or topic</label>
    <input class="mod-input" data-mod="script" type="text" placeholder="e.g. Why nobody watches past 3 seconds" />
    <p class="error" data-mod="script">Enter a hook or topic first</p>
    <button class="btn-primary gen-btn" data-mod="script">Write script</button>
    <div class="loading-row" data-mod="script">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="loading-text">shaping the story</span>
    </div>
    <div class="error-banner" data-mod="script"></div>
    <div class="list" data-mod="script"></div>
    <button class="btn-secondary regen-btn" data-mod="script">↻ Regenerate</button>
  </div>

  <div id="panel-clips" class="panel">
    <label>Video or podcast description</label>
    <input class="mod-input" data-mod="clips" type="text" placeholder="e.g. Podcast episode about pricing freelance work" />
    <p class="error" data-mod="clips">Enter a description first</p>
    <button class="btn-primary gen-btn" data-mod="clips">Find clip-worthy moments</button>
    <div class="loading-row" data-mod="clips">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="loading-text">scanning for gold</span>
    </div>
    <div class="error-banner" data-mod="clips"></div>
    <div class="list" data-mod="clips"></div>
    <button class="btn-secondary regen-btn" data-mod="clips">↻ Regenerate</button>
  </div>

  <div id="panel-caption" class="panel">
    <label>Post topic</label>
    <input class="mod-input" data-mod="caption" type="text" placeholder="e.g. 3-second hook mistake" />
    <p class="error" data-mod="caption">Enter a topic first</p>
    <button class="btn-primary gen-btn" data-mod="caption">Write captions</button>
    <div class="loading-row" data-mod="caption">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="loading-text">finding the right words</span>
    </div>
    <div class="error-banner" data-mod="caption"></div>
    <div class="list" data-mod="caption"></div>
    <button class="btn-secondary regen-btn" data-mod="caption">↻ Regenerate</button>
  </div>

  <div id="panel-plan" class="panel">
    <label>Goal for the week</label>
    <input class="mod-input" data-mod="plan" type="text" placeholder="e.g. Post 5 times this week" />
    <p class="error" data-mod="plan">Enter a goal first</p>
    <button class="btn-primary gen-btn" data-mod="plan">Build my week</button>
    <div class="loading-row" data-mod="plan">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="loading-text">mapping your week</span>
    </div>
    <div class="error-banner" data-mod="plan"></div>
    <div class="list" data-mod="plan"></div>
    <button class="btn-secondary regen-btn" data-mod="plan">↻ Regenerate</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="hooks" data-anim="iconPulse">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>
      <span>Hooks</span>
    </button>
    <button class="tab-btn" data-tab="script" data-anim="iconDraw">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      <span>Script</span>
    </button>
    <button class="tab-btn" data-tab="clips" data-anim="iconSnip">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 7.5 20 18M20 6 8.5 16.5"/></svg>
      <span>Clips</span>
    </button>
    <button class="tab-btn" data-tab="caption" data-anim="iconPop">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
      <span>Caption</span>
    </button>
    <button class="tab-btn" data-tab="plan" data-anim="iconTick">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </button>
  </div>
</div>

<script>
  var phrases = {
    hooks: ["cooking up something viral", "sparking new angles", "hunting your next hook"],
    script: ["shaping the story", "finding the right beats"],
    clips: ["scanning for gold", "spotting the best moments"],
    caption: ["finding the right words", "matching the platform tone"],
    plan: ["mapping your week", "spacing things out"]
  };

  function flashHeaderSpark() {
    var s = document.getElementById('header-spark');
    s.style.opacity = '1';
    setTimeout(function () { s.style.opacity = '0'; }, 1000);
  }

  function bindCopyIcons() {
    document.querySelectorAll('.copy-icon').forEach(function (icon) {
      icon.onclick = function () {
        var text = icon.getAttribute('data-copy');
        navigator.clipboard && navigator.clipboard.writeText(text);
        icon.textContent = '✓';
        icon.style.color = 'var(--success)';
        setTimeout(function () { icon.textContent = '⧉'; icon.style.color = 'var(--muted)'; }, 1200);
      };
    });
  }

  function renderList(mod, items) {
    var list = document.querySelector('.list[data-mod="' + mod + '"]');
    list.innerHTML = '';
    items.forEach(function (item, i) {
      var card = document.createElement('div');
      card.className = 'card';
      var copyText = item.title || item.t || '';
      var body;
      if (item.tag) {
        body = '<p style="font-weight:500;">' + item.title + '</p><span class="tag">' + item.tag + '</span>';
      } else if (item.label) {
        body = '<p class="card-label">' + item.label + '</p><p>' + item.t + '</p>';
      } else {
        body = '<p>' + item.t + '</p>';
      }
      card.innerHTML = body + '<span class="copy-icon" data-copy="' + copyText.replace(/"/g, '&quot;') + '">⧉</span>';
      list.appendChild(card);
      setTimeout(function () { card.classList.add('in'); }, 80 + i * 100);
    });
    document.querySelector('.regen-btn[data-mod="' + mod + '"]').style.display = 'block';
    bindCopyIcons();
    setTimeout(flashHeaderSpark, 80 + items.length * 100);
  }

  function runGenerate(mod, inputValue) {
    var loadingRow = document.querySelector('.loading-row[data-mod="' + mod + '"]');
    var errorBanner = document.querySelector('.error-banner[data-mod="' + mod + '"]');
    var genBtn = document.querySelector('.gen-btn[data-mod="' + mod + '"]');
    var opts = phrases[mod];
    loadingRow.querySelector('.loading-text').textContent = opts[Math.floor(Math.random() * opts.length)];
    document.querySelector('.list[data-mod="' + mod + '"]').innerHTML = '';
    document.querySelector('.regen-btn[data-mod="' + mod + '"]').style.display = 'none';
    errorBanner.style.display = 'none';
    loadingRow.style.display = 'flex';
    genBtn.disabled = true;

    fetch('/.netlify/functions/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ module: mod, input: inputValue })
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().then(function (err) { throw new Error(err.error || 'Something went wrong'); });
        }
        return res.json();
      })
      .then(function (items) {
        loadingRow.style.display = 'none';
        genBtn.disabled = false;
        renderList(mod, items);
      })
      .catch(function (err) {
        loadingRow.style.display = 'none';
        genBtn.disabled = false;
        errorBanner.textContent = err.message.indexOf('high demand') > -1 || err.message.indexOf('429') > -1
          ? "Lots of creators online right now — try again in a few seconds."
          : "Couldn't generate that — try again.";
        errorBanner.style.display = 'block';
      });
  }

  document.querySelectorAll('.gen-btn, .regen-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mod = btn.getAttribute('data-mod');
      var input = document.querySelector('.mod-input[data-mod="' + mod + '"]');
      var err = document.querySelector('.error[data-mod="' + mod + '"]');
      if (!input.value.trim()) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      runGenerate(mod, input.value.trim());
    });
  });

  document.querySelectorAll('.mod-input').forEach(function (input) {
    input.addEventListener('input', function () {
      var mod = input.getAttribute('data-mod');
      document.querySelector('.error[data-mod="' + mod + '"]').style.display = 'none';
    });
  });

  var tabs = document.querySelectorAll('.tab-btn');
  var panels = {
    hooks: document.getElementById('panel-hooks'),
    script: document.getElementById('panel-script'),
    clips: document.getElementById('panel-clips'),
    caption: document.getElementById('panel-caption'),
    plan: document.getElementById('panel-plan')
  };

  function setActive(btn) {
    var name = btn.getAttribute('data-tab');
    var anim = btn.getAttribute('data-anim');
    tabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
    Object.keys(panels).forEach(function (key) { panels[key].classList.toggle('active', key === name); });
    var icon = btn.querySelector('svg');
    icon.style.animation = 'none';
    void icon.offsetWidth;
    icon.style.animation = anim + ' 0.45s cubic-bezier(0.34,1.56,0.64,1)';
  }

  tabs.forEach(function (btn) { btn.addEventListener('click', function () { setActive(btn); }); });
</script>
</body>
</html>
